services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rca_postgres
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca
    ports:
      - "5433:5432"
    volumes:
      - rca_pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 5s
      retries: 10
volumes:
  rca_pgdata:
